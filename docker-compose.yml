# ========================================
# Docker Compose Configuration
# knowledge-hub
# ========================================
name: knowledge-hub

services:
  # ========================================
  # Development Service
  # ========================================
  app:
    environment:
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:${POSTGRES_PORT}/${POSTGRES_DB}?schema=public"
    build:
      context: .
      dockerfile: ./Dockerfile  # I know it's not necessary, but let's leave it for learning purposes.
    container_name: knowledge-hub
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '${PORT:-4000}:4000'
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/user || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    env_file: .env
    restart: on-failure
    networks:
      - knowledge-network

  # ========================================
  # PostgreSQL Database Service
  # ========================================
  db:
    image: postgres:16-alpine
    container_name: knowledge-hub-db
    env_file: .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped
    networks:
      - knowledge-network

  # ========================================
  # Adminer
  # ========================================
  adminer:
    image: adminer
    container_name: adminer-hub
    profiles:
      - debug
      - test
    restart: always
    ports:
      - 8080:8080
    networks:
      - knowledge-network 
    depends_on:
      - db
  
volumes:
  postgres_data:
networks:
  knowledge-network:

